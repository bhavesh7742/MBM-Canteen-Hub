name: MBM Canteen Hub — CI/CD Pipeline

# ─────────────────────────────────────────────
# WHEN this pipeline runs:
# - On every push to main branch (triggers full deploy)
# - On every pull request to main (runs lint+build only, no deploy)
# ─────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Global environment variables — available in all jobs
env:
  AWS_REGION: ap-south-1
  # YOUR AWS account ID stored in GitHub Secrets (never hardcode it)
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
  BACKEND_IMAGE: mbm-canteen-backend
  FRONTEND_IMAGE: mbm-canteen-frontend
  EKS_CLUSTER: mbm-canteen
  K8S_NAMESPACE: production

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Lint & Build Verification
  #
  # Why this job exists:
  # Catching errors here (30 seconds) is much cheaper than
  # catching them in Docker build (4 minutes) or worse, in prod.
  # ─────────────────────────────────────────────────────────────
  lint-and-build:
    name: 🔍 Lint & Build Check
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get your code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Node.js 22 (same version as our Dockerfiles)
      # The cache key is based on package-lock.json — if lockfile unchanged,
      # node_modules is reused from cache (saves ~60 seconds)
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # Step 3: Install exact dependencies from lockfile
      # `npm ci` is stricter than `npm install` — it fails if lockfile is outdated
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Step 4: Run ESLint on all React files
      # Catches: undefined variables, missing imports, broken JSX
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      # Step 5: Compile the Vite project
      # Catches: broken imports, TypeScript errors, missing components
      - name: Build frontend (verify it compiles)
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://api.mbmcanteen.yourdomain.com

      # Step 6: Install only production backend deps (mirrors Docker image)
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --only=production

      # Step 7: Quick sanity check — does server.js load without crashing?
      # Times out after 10 seconds (no real DB in CI — that's expected)
      - name: Verify backend starts (import check)
        working-directory: backend
        run: timeout 10 node -e "require('./server.js')" 2>&1 | head -10 || true
        env:
          NODE_ENV: test

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Build Docker Images & Push to Amazon ECR
  #
  # Why this job exists:
  # Creates immutable, versioned container images tagged with the
  # git commit SHA. This means you can always roll back to any
  # previous version by just deploying an older SHA tag.
  #
  # Only runs on push to main (not on pull requests)
  # ─────────────────────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-build  # Only run if Job 1 passes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # These outputs pass image tags to the deploy job
    outputs:
      image-tag: ${{ steps.image-tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Docker Buildx (required for layer caching with GitHub Actions)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate pipeline to AWS using IAM Access Keys from GitHub Secrets
      # You set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in:
      # GitHub → Settings → Secrets and variables → Actions
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Get an authentication token for ECR (valid 12 hours)
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Generate a short image tag from the git commit SHA
      # Example: if commit is abc12345def67890, tag becomes abc12345
      # This is immutable — the same tag always refers to the same code
      - name: Generate image tag
        id: image-tag
        run: |
          TAG="${GITHUB_SHA::8}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "📦 Image tag: ${TAG}"

      # Build and push backend image
      # cache-from/cache-to: reuse Docker layers from GitHub's cache
      # This cuts build time from ~4 minutes to ~40 seconds on cache hit
      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.image-tag.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and push frontend image
      # VITE_API_URL is baked into the static build at compile time
      # Important: this must match the domain where your backend runs
      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.image-tag.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Deploy to Kubernetes on Amazon EKS
  #
  # Why this job exists:
  # After new images are in ECR, we tell Kubernetes to use them.
  # Kubernetes does a "rolling update" — old pods stay alive until
  # new pods are healthy. Zero downtime.
  #
  # If deployment fails, we automatically rollback to the previous version.
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production   # Requires manual approval if configured in GitHub

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # This command downloads the cluster credentials and adds them to ~/.kube/config
      # After this, kubectl knows which cluster to talk to
      - name: Connect kubectl to EKS cluster
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER }} \
            --region ${{ env.AWS_REGION }}

      # Apply all Kubernetes configuration files
      # This creates/updates: namespace, configmap, secrets, deployments, services, ingress
      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/metrics-server.yaml
          kubectl apply -f k8s/production/namespace.yaml
          kubectl apply -f k8s/production/configmap.yaml
          kubectl apply -f k8s/production/backend-deployment.yaml
          kubectl apply -f k8s/production/backend-service.yaml
          kubectl apply -f k8s/production/backend-hpa.yaml
          kubectl apply -f k8s/production/pdb.yaml
          kubectl apply -f k8s/production/frontend-deployment.yaml
          kubectl apply -f k8s/production/frontend-service.yaml
          kubectl apply -f k8s/production/ingress.yaml

      # Update just the image tag on existing deployments
      # `kubectl set image` triggers a rolling update without recreating the whole deployment
      - name: Update backend image to new version
        run: |
          kubectl set image deployment/mbm-backend \
            backend=${{ env.ECR_REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ needs.build-and-push.outputs.image-tag }} \
            -n ${{ env.K8S_NAMESPACE }}

      - name: Update frontend image to new version
        run: |
          kubectl set image deployment/mbm-frontend \
            frontend=${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ needs.build-and-push.outputs.image-tag }} \
            -n ${{ env.K8S_NAMESPACE }}

      # Wait up to 5 minutes for pods to be ready
      # If they don't become ready in time, this step FAILS → triggers rollback
      - name: Wait for rollout to complete
        run: |
          echo "⏳ Waiting for backend rollout..."
          kubectl rollout status deployment/mbm-backend \
            -n ${{ env.K8S_NAMESPACE }} --timeout=300s

          echo "⏳ Waiting for frontend rollout..."
          kubectl rollout status deployment/mbm-frontend \
            -n ${{ env.K8S_NAMESPACE }} --timeout=300s

      # Quick check: are pods actually running?
      - name: Show pod status
        run: |
          echo "📊 Pod status:"
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "🌐 Services:"
          kubectl get svc -n ${{ env.K8S_NAMESPACE }}

      # ─────────────────────────────────────────────
      # ROLLBACK: If any step above failed, undo it
      # `kubectl rollout undo` restores the previous ReplicaSet
      # (the previous working version of your app)
      # ─────────────────────────────────────────────
      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deployment failed — rolling back to previous version..."
          kubectl rollout undo deployment/mbm-backend -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout undo deployment/mbm-frontend -n ${{ env.K8S_NAMESPACE }}

          echo "⏳ Waiting for rollback to complete..."
          kubectl rollout status deployment/mbm-backend -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/mbm-frontend -n ${{ env.K8S_NAMESPACE }}

          echo "📊 Pod status after rollback:"
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}

          echo "✅ Rollback complete — previous version is live"
