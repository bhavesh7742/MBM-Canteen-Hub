# ─────────────────────────────────────────────────────────
# AWS Load Balancer Controller Service Account
# ─────────────────────────────────────────────────────────
#
# WHY DO WE NEED THIS?
# The AWS Load Balancer Controller pod needs permission to
# call AWS APIs (EC2, ALB, WAF, ACM) to create the load balancer.
#
# HOW DOES IT WORK?
# EKS uses IAM Roles for Service Accounts (IRSA). We annotate
# the ServiceAccount with the IAM Role ARN. The EKS pod identity
# webhook automatically injects the AWS token and environment
# variables into the pods using this service account.
#
# Interview answer: "We use IRSA to bind the AWS Load Balancer
# Controller ServiceAccount to an IAM Role, following the
# Principle of Least Privilege so other pods cannot call AWS APIs."
# ─────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/name: aws-load-balancer-controller
  name: aws-load-balancer-controller
  namespace: kube-system
  annotations:
    # Associate Kubernetes ServiceAccount with AWS IAM Role
    eks.amazonaws.com/role-arn: arn:aws:iam::941960167673:role/AmazonEKSLoadBalancerControllerRole
