apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    name: monitoring
    purpose: observability
---
# ─────────────────────────────────────────────────────────
# PersistentVolumeClaim for Prometheus
# ─────────────────────────────────────────────────────────
# Without this, Prometheus data is lost every time the pod restarts
# With this, data is stored on an EBS volume that persists across pod restarts
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce      # Only one pod can write at a time (standard for Prometheus)
  resources:
    requests:
      storage: 10Gi      # 10 GB — enough for ~2 weeks of metrics history
  storageClassName: gp2  # AWS EBS General Purpose SSD (automatically provisioned on EKS)
---
# ─────────────────────────────────────────────────────────
# Prometheus Deployment
# ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1  # Prometheus is stateful — always run exactly 1 replica
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus   # Needs permission to list pods (for Kubernetes SD)
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            # Tell Prometheus where its config file is
            - "--config.file=/etc/prometheus/prometheus.yml"
            # Tell Prometheus where to store metric data
            - "--storage.tsdb.path=/prometheus"
            # How long to keep metrics history (15 days)
            - "--storage.tsdb.retention.time=15d"
            # Allow all IPs to call the Prometheus API (needed for Grafana)
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
          volumeMounts:
            # Mount the ConfigMap as a file at /etc/prometheus/prometheus.yml
            - name: prometheus-config-volume
              mountPath: /etc/prometheus
            # Mount the PVC at /prometheus (persistent storage)
            - name: prometheus-storage-volume
              mountPath: /prometheus
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        # prometheus.yml configuration comes from a Kubernetes ConfigMap
        - name: prometheus-config-volume
          configMap:
            defaultMode: 420
            name: prometheus-server-conf
        # Metrics data stored on a persistent EBS volume (survives pod restarts)
        - name: prometheus-storage-volume
          persistentVolumeClaim:
            claimName: prometheus-pvc
---
# ─────────────────────────────────────────────────────────
# Prometheus Service
# ─────────────────────────────────────────────────────────
# Exposes Prometheus on port 9090 within the cluster
# Grafana connects to this service to query metrics
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
  type: ClusterIP  # Only accessible within the cluster (Grafana connects to it)
---
# ─────────────────────────────────────────────────────────
# Prometheus ConfigMap — Scrape Configuration
# ─────────────────────────────────────────────────────────
# This tells Prometheus:
# 1. How often to collect metrics (every 15 seconds)
# 2. Which pods to scrape (those with prometheus.io/scrape=true annotation)
# 3. Which port and path to scrape from each pod
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-server-conf
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s        # Collect metrics every 15 seconds
      evaluation_interval: 15s    # Evaluate alert rules every 15 seconds

    scrape_configs:
      # Scrape job: discover backend pods automatically using Kubernetes SD
      - job_name: 'mbm-backend'
        kubernetes_sd_configs:
          - role: pod              # Discover individual pods (not services)
            namespaces:
              names: [production]  # Only look in the production namespace

        relabel_configs:
          # RULE 1: Only scrape pods that have prometheus.io/scrape=true annotation
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true

          # RULE 2: Use the path from prometheus.io/path annotation (/api/metrics)
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)

          # RULE 3: Use the port from prometheus.io/port annotation (5000)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2

          # RULE 4: Add a label with the pod name (for filtering in Grafana)
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

          # RULE 5: Add a label with the namespace
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
---
# ─────────────────────────────────────────────────────────
# ServiceAccount for Prometheus
# ─────────────────────────────────────────────────────────
# Prometheus needs permission to list pods in the production namespace
# so it can discover which pods to scrape
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
