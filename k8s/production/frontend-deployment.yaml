apiVersion: apps/v1
kind: Deployment
metadata:
  name: mbm-frontend
  namespace: production
  labels:
    app: mbm-frontend
    version: "1.0"
spec:
  # 2 replicas = if one crashes, users still see the site
  replicas: 2
  selector:
    matchLabels:
      app: mbm-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # Allow 1 extra during update
      maxUnavailable: 0  # Zero downtime — always keep 2 running
  template:
    metadata:
      labels:
        app: mbm-frontend
    spec:
      containers:
        - name: frontend
          # Replace 941960167673 with your actual 12-digit AWS account ID
          image: 941960167673.dkr.ecr.ap-south-1.amazonaws.com/mbm-canteen-frontend:latest
          ports:
            - containerPort: 80
          resources:
            # Frontend is nginx serving static files — very lightweight
            requests:
              memory: "64Mi"   # Only 64MB needed for nginx
              cpu: "50m"       # Very little CPU for static serving
            limits:
              memory: "128Mi"
              cpu: "100m"
          # Liveness: is nginx still alive?
          livenessProbe:
            httpGet:
              path: /health    # This endpoint is defined in nginx.conf
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          # Readiness: is nginx ready to serve pages?
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
