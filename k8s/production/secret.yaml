# ─────────────────────────────────────────────────────────
# MBM Canteen Hub — Kubernetes Secret Template
# ─────────────────────────────────────────────────────────
#
# ⚠️  THIS FILE IS A TEMPLATE — DO NOT PUT REAL VALUES HERE
#
# Kubernetes Secrets store sensitive data like passwords and
# API keys. They are base64-encoded (NOT encrypted) by default.
#
# HOW TO CREATE THE SECRET (choose one method):
#
# ── Method 1: kubectl create secret (recommended for beginners) ──
#
#   kubectl create secret generic mbm-secrets \
#     --from-literal=mongo-uri='mongodb+srv://mbmadmin:<password>@backend.gm4jseh.mongodb.net/mbm-canteen-hub' \
#     --from-literal=jwt-secret='dy12MRlICwZECZx7sAPHq6HjdVzvujT1d1nVXaVyv0w' \
#     --from-literal=grafana-password='ChooseAStrongPassword123!' \
#     -n production
#
# ── Method 2: Apply this file (values must be base64-encoded) ──
#
#   echo -n 'your-value' | base64
#   Then replace the base64 placeholders below and run:
#   kubectl apply -f k8s/production/secret.yaml
#
# ─────────────────────────────────────────────────────────
# WHY BASE64 AND NOT PLAIN TEXT?
# Base64 is NOT encryption — it's just encoding. Anyone with
# kubectl get secret can decode it. For real production:
# - Use AWS Secrets Manager or HashiCorp Vault
# - Use Sealed Secrets (encrypts at rest in Git)
# - Use External Secrets Operator
# For a placement project, this approach is acceptable and
# demonstrates understanding of Kubernetes secret management.
# ─────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: mbm-secrets
  namespace: production
type: Opaque
data:
  # Run: echo -n 'your-mongo-uri' | base64
  mongo-uri: REPLACE_WITH_BASE64_ENCODED_MONGO_URI

  # Run: echo -n 'your-jwt-secret' | base64
  jwt-secret: REPLACE_WITH_BASE64_ENCODED_JWT_SECRET

  # Run: echo -n 'your-grafana-password' | base64
  grafana-password: REPLACE_WITH_BASE64_ENCODED_GRAFANA_PASSWORD
