apiVersion: apps/v1
kind: Deployment
metadata:
  name: mbm-backend
  namespace: production
  labels:
    app: mbm-backend
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mbm-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: mbm-backend
    spec:
      containers:
        - name: backend
          image: 941960167673.dkr.ecr.ap-south-1.amazonaws.com/mbm-canteen-backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mbm-secrets
                  key: mongo-uri
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mbm-secrets
                  key: jwt-secret
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: mbm-config
                  key: frontend-url
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
