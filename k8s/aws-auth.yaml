apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-auth
  namespace: kube-system
data:
  # ─────────────────────────────────────────────────────────
  # mapRoles: Maps IAM Roles to Kubernetes RBAC groups
  #
  # WHY THIS EXISTS:
  # EKS does not use Kubernetes usernames/passwords for auth.
  # Instead, it uses AWS IAM. When a kubectl command runs,
  # EKS checks the caller's IAM identity in this ConfigMap.
  # ─────────────────────────────────────────────────────────
  mapRoles: |
    # Worker Nodes IAM Role → system:nodes group
    # This allows EC2 instances to join the cluster as nodes
    - rolearn: arn:aws:iam::941960167673:role/mbm-eks-node-role
      groups:
      - system:bootstrappers
      - system:nodes
      username: system:node:{{EC2PrivateDNSName}}

  # ─────────────────────────────────────────────────────────
  # mapUsers: Maps IAM Users to Kubernetes RBAC groups
  #
  # We add mbm-github-actions here so the GitHub Actions
  # pipeline can run kubectl commands (kubectl set image,
  # kubectl rollout status, etc.)
  #
  # system:masters = full cluster admin (equivalent to root)
  # For production, you could restrict this to a custom role.
  # For a learning/placement project, system:masters is fine.
  # ─────────────────────────────────────────────────────────
  mapUsers: |
    - userarn: arn:aws:iam::941960167673:user/mbm-github-actions
      username: mbm-github-actions
      groups:
      - system:masters
