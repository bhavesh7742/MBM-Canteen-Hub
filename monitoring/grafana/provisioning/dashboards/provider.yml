# ─────────────────────────────────────────────────────────
# Grafana Dashboard Provider Configuration
# ─────────────────────────────────────────────────────────
# This tells Grafana: "Look in /etc/grafana/provisioning/dashboards/
# for any .json files and load them as dashboards automatically."
apiVersion: 1

providers:
  - name: MBM Canteen Dashboards
    orgId: 1
    type: file
    disableDeletion: false    # Allow deleting dashboards from UI
    updateIntervalSeconds: 30 # Check for new/changed dashboard files every 30s
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
