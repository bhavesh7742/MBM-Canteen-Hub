# ─────────────────────────────────────────────────────────
# Grafana Datasource Auto-Provisioning
# ─────────────────────────────────────────────────────────
#
# WHY THIS FILE?
# Normally you'd have to open Grafana → Settings → Data Sources
# and manually add Prometheus every time you spin up a new container.
# This file tells Grafana to do it automatically on startup.
#
# WHERE DOES GRAFANA READ THIS?
# Grafana reads all .yml files from /etc/grafana/provisioning/datasources/
# We mount this file there via docker-compose.yml volume mapping.
# ─────────────────────────────────────────────────────────
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy

    # In docker-compose, services talk to each other by container name
    # "mbm-prometheus" is the container_name in docker-compose.yml
    url: http://mbm-prometheus:9090

    isDefault: true    # This will be the default datasource for all dashboards
    editable: false    # Prevent accidental changes through the UI
    uid: prometheus    # Stable UID — dashboards can reference this by ID
